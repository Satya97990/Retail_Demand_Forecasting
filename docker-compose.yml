services:
  mlflow:
    build:
      context: ./docker/mlflow
    ports:
      - "5000:5000"
    volumes:
      - ./mlflow-data:/mlflow
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 15s
      timeout: 5s
      retries: 5

  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      MODEL_PATH: /app/models/model.joblib
    depends_on:
      mlflow:
        condition: service_healthy
